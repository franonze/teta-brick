name: Deploy WWW to GitHub Pages

on:
  push:
    branches: ["main"] # Cambia a "master" si tu rama principal se llama así

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Subir carpeta www
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'www' # <--- Aquí le indicamos tu carpeta de Capacitor

      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
